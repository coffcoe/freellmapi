# CNB NPC API-触发胶水（freellmapi 版 · 需 push）
# 与 web2kb 唯一区别：sandbox: false -> 流水线内 CNB_TOKEN 有效，NPC 可 push npc/* 分支。
# 配套触发时务必传 npc.workMode: true（写权限 scope），否则即便 sandbox:false 也缺写权。
# 仅 freellmapi Batch1（TD-012a/012b/027 直改代码）使用；其余工作流用 web2kb 仓库的 .cnb.yml（sandbox:true）。
#
# ⚠️ 关键：api_trigger 事件必须挂在分支键（main）之下，不能顶格写！
#    顶格写会被 CNB 报 CONFIG_EVENT_EMPTY（"for branch main and $"）。
#    参考官方 demo：所有事件都嵌套在 main: 之下。
#    api_trigger_npc 必须是「映射」形态（docker/sandbox/stages 同级键），不能有前导 -。

main:
  api_trigger_npc:
    docker:
      image: cnbcool/default-npc:latest
    sandbox: false
    stages:
      - name: npc go
        type: npc:go
        options:
          systemPrompt: $systemPrompt
          userPrompt: $userPrompt
