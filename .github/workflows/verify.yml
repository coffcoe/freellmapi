name: Weekly Provider Verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify.yml'
      - 'server/src/scripts/validate-providers.ts'
      - 'server/src/scripts/import-provider-meta.ts'
  schedule:
    # Run every Monday at 06:00 UTC (14:00 CST)
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      slice:
        description: 'Provider slice to verify'
        required: false
        default: 'no-card'
        type: choice
        options:
          - no-card
          - no-phone
          - commercial

jobs:
  verify-providers:
    name: Verify Free LLM Providers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create output directories
        run: mkdir -p server/data logs

      - name: Initialize database with migrations
        run: npx tsx server/src/db/migrate/cli.ts up

      - name: Fetch provider dataset
        id: fetch
        run: |
          SLICE="${{ github.event.inputs.slice || 'no-card' }}"
          OUTPUT_FILE="server/data/providers-${SLICE}.json"
          echo "Fetching $SLICE slice..."

          # Fetch from API with timeout and retry
          curl -sSL --max-time 30 --retry 2 \
            "https://freellmapihub.com/api/v1/${SLICE}.json" \
            -o "$OUTPUT_FILE"

          # Verify download succeeded
          if [ ! -s "$OUTPUT_FILE" ]; then
            echo "❌ Failed to fetch provider data"
            exit 1
          fi

          echo "slice=$SLICE" >> $GITHUB_OUTPUT
          echo "file=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      - name: Validate schema
        run: |
          SLICE="${{ github.event.inputs.slice || 'no-card' }}"
          npx tsx server/src/scripts/validate-providers.ts \
            "server/data/providers-${SLICE}.json"

      - name: Run import script
        run: |
          SLICE="${{ github.event.inputs.slice || 'no-card' }}"
          npx tsx server/src/scripts/import-provider-meta.ts \
            "server/data/providers-${SLICE}.json" \
            "logs/weekly-verify-${SLICE}-$(date +%Y%m%d).log"

      - name: Check database state
        run: |
          node -e "
            const db = require('./node_modules/better-sqlite3')('./server/data/freeapi.db');
            const r = db.prepare(\`
              SELECT COUNT(*) as total,
                     SUM(CASE WHEN card_required=1 THEN 1 ELSE 0 END) as with_card,
                     SUM(CASE WHEN phone_required=1 THEN 1 ELSE 0 END) as with_phone,
                     SUM(CASE WHEN commercial_ok=1 THEN 1 ELSE 0 END) as commercial_ok,
                     SUM(CASE WHEN provider_slug IS NOT NULL THEN 1 ELSE 0 END) as mapped
              FROM models
            \`).get();
            console.log(JSON.stringify(r, null, 2));
          "

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report-${{ github.run_number }}
          path: |
            server/data/providers-*.json
            logs/weekly-verify-*.log
